{% extends "base.html" %}
{%  block content %}
  <h1>Manufacturer List:</h1>
  {%  if manufacturer_list %}
  <ul>
    {% for manufacturer in manufacturer_list %}
      <li>Name: {{ manufacturer.name }}, Country: {{ manufacturer.country }}</li>
    {% endfor %}
  </ul>
  {% else %}
  <p>No Manufacturers</p>
  {% endif %}
{%  endblock %}
